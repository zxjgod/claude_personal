# Full quality gate: typecheck → lint/format → tests → smoke.
#
# Order matters. Typecheck and lint are cheap and catch the most, so they run
# before the slow suite. The smoke step goes last because it is the only step
# that builds the real artifact and starts the real CLI.
#
# (Keep the command names out of this header: ci-smoke.test.ts locates each
# gate by string index and asserts smoke comes after the unit tests.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    # Windows is this project's primary shell (cmd.exe), and the ripgrep
    # argv/execFile path, path-containment checks and smoke test all have
    # platform-specific behaviour — so both legs are mandatory.
    #
    # NOTE: scripts/architecture-docs.mjs can assert this matrix, but nothing
    # here runs it — it is reached only via `npm run docs:sync`, which is not a
    # CI step. Dropping a platform below would NOT fail the build. Add a
    # "npm run docs:sync -- --check" step if that invariant should be enforced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Smoke (build, start, graceful exit without an API key)
        run: npm run smoke

      - name: Published package (unpack, CLI, SDK, release notes)
        run: npm run smoke:package
